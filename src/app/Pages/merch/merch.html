<h1 class="page-title">{{ title }}</h1>
    <p>Find your favourite merchandise here!</p>

<section class="card-container">
    @if (loading()) {
        <p>Loading merchandise...</p>
    } @else if (error()) {
        <p class="error">Error loading merchandise: {{ error() }}</p>
    } @else {
        @for (item of merch(); track item.id) {
        <div class="card">
            <h3>{{ item.name }}</h3>
            <p>Price: {{ item.price }}</p>
            <p>{{ item.description }}</p>
            <button>Add to Cart</button>
        </div>
        }
    }
</section>
